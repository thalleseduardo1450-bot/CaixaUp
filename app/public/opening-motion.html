<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self'; media-src 'self'">
  <title>CaixaUp</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { position: relative; background: #fff; }
    video, img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }
    img { opacity: 1; transition: opacity 120ms linear; }
    video { opacity: 0; transition: opacity 120ms linear; }
    body.player-ready video { opacity: 1; }
    body.player-ready img { opacity: 0; }
    [hidden] { display: none; }

    #skip {
      position: absolute;
      inset: auto 16px 16px auto;
      z-index: 2;
      padding: 8px 16px;
      border: 1px solid rgba(17, 24, 39, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #111827;
      font: 600 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      cursor: pointer;
      opacity: 0;
      transition: opacity 160ms linear, background 120ms linear;
    }
    body.player-ready #skip { opacity: 1; }
    #skip:hover { background: #fff; }
    #skip:focus-visible { outline: 2px solid #16a34a; outline-offset: 2px; opacity: 1; }
    @media (prefers-reduced-motion: reduce) { #skip { transition: none; } }
  </style>
</head>
<body>
  <img src="./startup/poster.jpg" alt="CaixaUp — Seu negócio. No seu ritmo.">
  <video muted playsinline preload="auto" poster="./startup/poster.jpg" aria-label="Vídeo de abertura CaixaUp">
    <source src="./startup/caixaup-opening.mp4" type="video/mp4">
    <source src="./startup/caixaup-opening.webm" type="video/webm">
  </video>
  <button id="skip" type="button">Pular</button>
  <script src="./opening-player.js"></script>
</body>
</html>
