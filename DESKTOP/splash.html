/* Layout: player escuro com o palco 16:9 no centro; o palco (1920x1080) é a abertura em si, no fundo claro do app. */
:root {
  color-scheme: dark;
  --page: #070d1d;
  --ink: #e2e8f0;
  --muted: #8b9ab3;
  --track: #1b2740;
  --brand: #1d63e0;
  --leaf: #15be87;
  --navy: #1e3a5f;
  --up: #10b981;
  --paper: #f8fafc;
  --tagline: #5b6b82;
  --display: "CU Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --text: "CU Text", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--ink); font-family: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  box-sizing: border-box; overflow: hidden;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.frame {
  position: relative; overflow: hidden; border-radius: 10px;
  width: min(100%, calc((100dvh - 96px) * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9;
  background: var(--paper); box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
}
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
.fx { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; pointer-events: none; }

.dark { background: radial-gradient(circle at 50% 50%, #15306b 0%, #0a1634 42%, #050a18 100%); }
.core {
  position: absolute; left: 949px; top: 529px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 18px 6px #bfdbfe, 0 0 60px 22px rgba(96, 165, 250, .75), 0 0 160px 70px rgba(37, 99, 235, .45);
  transform: scale(0);
}
.light { background: var(--paper); clip-path: circle(0px at 960px 540px); }
.aurora { position: absolute; border-radius: 50%; width: 1100px; height: 1100px; }
.a1 { left: -380px; top: -520px; background: radial-gradient(circle, rgba(37, 99, 235, .22) 0%, rgba(37, 99, 235, 0) 68%); }
.a2 { left: 1180px; top: 420px; background: radial-gradient(circle, rgba(16, 185, 129, .20) 0%, rgba(16, 185, 129, 0) 68%); }
.a3 { left: 1100px; top: -620px; background: radial-gradient(circle, rgba(56, 189, 248, .20) 0%, rgba(56, 189, 248, 0) 68%); }
.a4 { left: -300px; top: 520px; background: radial-gradient(circle, rgba(29, 99, 224, .12) 0%, rgba(29, 99, 224, 0) 68%); }
.dots {
  background-image: radial-gradient(rgba(29, 99, 224, .20) 1.6px, transparent 2px);
  background-size: 34px 34px;
  -webkit-mask-image: radial-gradient(ellipse 60% 62% at 50% 50%, #000 0%, transparent 100%);
  mask-image: radial-gradient(ellipse 60% 62% at 50% 50%, #000 0%, transparent 100%);
}
.lockup { position: absolute; inset: 0; transform-origin: 960px 540px; }
.logo { position: absolute; transform-origin: 50% 50%; }
.logo svg { width: 100%; height: 100%; overflow: visible; display: block; }
.shadow {
  position: absolute; left: 14%; right: 14%; height: 70px; bottom: -26px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(30, 58, 95, .30) 0%, rgba(30, 58, 95, 0) 70%);
  opacity: 0;
}
.word {
  position: absolute; white-space: nowrap;
  font: 900 180px/1 var(--display); letter-spacing: -0.035em;
  clip-path: inset(-12% -6% -28% -6%);
}
.word .ch { display: inline-block; will-change: transform; }
.word .c { color: var(--navy); }
.word .u { color: var(--up); }
.glint {
  position: absolute; white-space: nowrap; pointer-events: none;
  font: 900 180px/1 var(--display); letter-spacing: -0.035em; color: rgba(255, 255, 255, .8);
  -webkit-mask-image: linear-gradient(105deg, transparent 0%, transparent 42%, #000 50%, transparent 58%, transparent 100%);
  mask-image: linear-gradient(105deg, transparent 0%, transparent 42%, #000 50%, transparent 58%, transparent 100%);
  -webkit-mask-size: 250% 100%; mask-size: 250% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: 100% 0; mask-position: 100% 0;
  opacity: 0;
}
.tag {
  position: absolute; white-space: nowrap; text-transform: uppercase;
  font: 600 26px/1.2 var(--text); color: var(--tagline);
  clip-path: inset(-20% 100% -20% -2%);
}

.controls { display: flex; align-items: center; gap: 12px; width: min(100%, calc((100dvh - 96px) * 16 / 9)); }
.controls button {
  font: 600 14px/1 var(--text); color: var(--ink); background: var(--track);
  border: 1px solid #2a3a5c; border-radius: 8px; padding: 9px 14px; cursor: pointer;
}
.controls button:hover { background: #24345a; }
.controls button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.track { flex: 1; min-width: 0; height: 6px; border-radius: 99px; background: var(--track); cursor: pointer; position: relative; }
.track span { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--leaf)); }
.time { font: 600 13px/1 var(--text); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 82px; text-align: right; }

.wait { position: absolute; left: 460px; top: 650px; width: 1000px; display: flex; flex-direction: column; align-items: center; gap: 24px; opacity: 0; transition: opacity .6s ease; }
.wait.on { opacity: 1; }
.wait .bar { width: 420px; height: 8px; border-radius: 99px; background: rgba(29, 99, 224, .14); overflow: hidden; }
.wait .bar span { display: block; width: 40%; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--leaf)); animation: slide 1.15s ease-in-out infinite; }
.wait p { font: 600 34px/1.2 var(--text); color: var(--tagline); margin: 0; white-space: nowrap; text-align: center; }
@keyframes slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(255%); } }

body.splash { padding: 0; display: block; background: #050a18; user-select: none; cursor: default; -webkit-app-region: drag; }
body.splash .frame { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; background: #050a18; }
body.splash .controls { display: none; }
body.render { padding: 0; display: block; }
body.render .frame { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
body.render .controls { display: none; }
body { margin: 0; }
</style>

</head>

    let core = E.outBack(prog(t, 0.05, 0.38), 2.2) + 0.9 * E.inCubic(prog(t, 0.36, 0.56));
    $("core").style.transform = `scale(${core * (1 + 0.06 * Math.sin(t * 40))})`;

    // 2) explosão: o fundo claro se abre em círculo
    const pb = prog(t, 0.55, 1.4);
    const R = 1180 * E.outQuart(pb);
    $("light").style.clipPath = `circle(${R}px at 960px 540px)`;
    const r1 = $("ring1"), r2 = $("ring2");
    r1.setAttribute("r", R); r1.setAttribute("stroke-width", lerp(16, 2, pb)); r1.setAttribute("opacity", pb > 0 && pb < 1 ? Math.pow(1 - pb, 1.4) : 0);
    const pb2 = prog(t, 0.62, 1.35);
    r2.setAttribute("r", 1180 * E.outQuart(pb2) * 0.96); r2.setAttribute("opacity", pb2 > 0 && pb2 < 1 ? 0.7 * Math.pow(1 - pb2, 2) : 0);
    const pf = prog(t, 0.42, 0.9);
    const fw = 1500 * E.outCubic(pf);
    const flare = $("flare");
    flare.setAttribute("x", 960 - fw / 2); flare.setAttribute("width", fw);
    flare.setAttribute("opacity", pf > 0 && pf < 1 ? Math.sin(Math.PI * pf) * 0.9 : 0);

    // 3) fundo claro: aurora, pontos e partículas
    const drift = t * 0.6;
    $("a1").style.transform = `translate(${Math.sin(drift) * 40}px, ${Math.cos(drift * 0.8) * 30}px)`;
    $("a2").style.transform = `translate(${Math.cos(drift * 0.9) * -50}px, ${Math.sin(drift) * 35}px)`;
    $("a3").style.transform = `translate(${Math.sin(drift * 1.1) * -30}px, ${Math.cos(drift) * 40}px)`;
    $("a4").style.transform = `translate(${Math.cos(drift * 0.7) * 45}px, ${Math.sin(drift * 1.2) * -25}px)`;
    const endFade = 1 - 0.55 * E.inOutCubic(prog(t, 5.3, 6.3));
    $("dots").style.backgroundPosition = `0px ${-t * 14}px`;
    $("dots").style.opacity = E.outCubic(prog(t, 0.9, 1.8)) * endFade;
    const ma = E.outCubic(prog(t, 1.0, 1.8)) * (1 - E.inOutCubic(prog(t, 5.3, 6.2)));
    for (const m of motes) {
      const y = 1110 - ((m.off + m.sp * t) % 1240);
      const x = m.x + Math.sin(t * m.fr * 6.28 + m.ph) * m.amp;
      const edge = clamp((1110 - y) / 160) * clamp((y + 130) / 260);
      m.el.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
      m.el.setAttribute("opacity", (m.a * edge * ma).toFixed(3));
    }

    // 4) o "C" é desenhado girando
    const pc = prog(t, 0.8, 1.85);
    const draw = E.inOutCubic(pc);
    $("sweepPath").setAttribute("stroke-dashoffset", 1 - draw);
    const head = draw;
    const tail = E.inOutCubic(prog(t, 1.05, 2.1));
    const orbit = $("orbit");
    orbit.setAttribute("stroke-dasharray", `${Math.max(0, head - tail)} 3`);
    orbit.setAttribute("stroke-dashoffset", -tail);
    orbit.setAttribute("opacity", t < 0.8 || tail >= 1 ? 0 : 0.85);
    const ang = A0 - SPAN * draw;
    const cp = pt(372, ang);
    const comet = $("comet");
    comet.setAttribute("cx", cp[0]); comet.setAttribute("cy", cp[1]);
    comet.setAttribute("opacity", pc > 0 && pc < 1 ? Math.sin(Math.PI * Math.min(1, pc * 1.15)) * 0.95 : 0);

    // escala/rotação/posição do logo
    let s = lerp(0.62, 1, E.outBack(prog(t, 0.8, 1.9), 1.4));
    let rot = lerp(55, 0, E.outCubic(prog(t, 0.8, 2.0)));
    s *= 1 + 0.045 * Math.sin(Math.PI * prog(t, 2.12, 2.55));
    const pm = E.inOutCubic(prog(t, 2.8, 3.55));
    s *= lerp(1, LS, pm);
    const lx = L.logoX * pm;
    $("logo").style.transform = `translate(${lx}px, 0px) rotate(${rot}deg) scale(${t < 0.8 ? 0 : s})`;
    $("shadow").style.opacity = E.outCubic(prog(t, 1.2, 2.0)) * (1 - 0.4 * pm);

    // 5) folha verde aparece
    const pl = prog(t, 1.62, 2.18);
    const ls = E.outBack(pl, 2.6), lr = lerp(-50, 0, E.outCubic(pl));
    $("leafG").setAttribute("transform", `translate(${LEAF_O[0]} ${LEAF_O[1]}) rotate(${lr}) scale(${Math.max(0, ls)}) translate(${-LEAF_O[0]} ${-LEAF_O[1]})`);
    for (const sp of sparks) {
      const p = prog(t, 1.8 + sp.d, 2.38 + sp.d);
      const a = 150 + 210 * E.outCubic(p), b = 150 + 290 * E.outCubic(Math.min(1, p * 1.5));
      const c = Math.cos(sp.ang), si = Math.sin(sp.ang);
      sp.el.setAttribute("x1", LEAF_C[0] + c * a); sp.el.setAttribute("y1", LEAF_C[1] + si * a);
      sp.el.setAttribute("x2", LEAF_C[0] + c * b); sp.el.setAttribute("y2", LEAF_C[1] + si * b);
      sp.el.setAttribute("opacity", p > 0 && p < 1 ? 1 : 0);
    }

    // 6) brilho passando no logo (duas vezes)
    const sh1 = prog(t, 2.2, 2.85), sh2 = prog(t, 4.45, 5.05);
    const shp = sh1 > 0 && sh1 < 1 ? sh1 : sh2;
    const shine = $("shine");
    shine.setAttribute("transform", `translate(${lerp(-100, 1150, E.inOutSine(shp))} 0) rotate(20 120 600)`);
    shine.setAttribute("opacity", (sh1 > 0 && sh1 < 1) || (sh2 > 0 && sh2 < 1) ? 0.75 : 0);

    // 7) nome entra letra por letra
    chars.forEach((el, i) => {
      const p = prog(t, 3.3 + i * 0.05, 3.3 + i * 0.05 + 0.6);
      const e = i >= 5 ? E.outBack(p, 2.4) : E.outQuart(p);
      el.style.transform = `translateY(${(1 - e) * 125}%) rotate(${(1 - E.outCubic(p)) * 10}deg)`;
    });
    const pt2 = E.inOutCubic(prog(t, 3.8, 4.35));
    const tag = $("tag");
    tag.style.clipPath = `inset(-20% ${(1 - pt2) * 102}% -20% -2%)`;
    const tagOut = E.inOutCubic(prog(t, 5.28, 5.62));
    tag.style.opacity = 1 - tagOut;
    const pw = E.inOutCubic(prog(t, 5.35, 6.05));
    const wTop = lerp(L.wordTop, L.wordTopEnd, pw);
    $("word").style.top = $("glint").style.top = wTop + "px";
    tag.style.top = L.wordTop + L.wordH + TAG_GAP - 10 * tagOut + "px";
    const g1 = prog(t, 4.5, 5.1), g2 = prog(t, 6.4, 6.95);
    const gp = g1 > 0 && g1 < 1 ? g1 : g2;
    const glint = $("glint");
    glint.style.opacity = (g1 > 0 && g1 < 1) || (g2 > 0 && g2 < 1) ? 1 : 0;
    const mp = `${100 - 100 * E.inOutSine(gp)}% 0`;
    glint.style.maskPosition = mp; glint.style.webkitMaskPosition = mp;

    // 8) tudo encolhe e fica pequeno no centro
    let S = 1;
    S *= 1 + 0.03 * E.outSine(prog(t, 5.3, 5.45));
    S = lerp(S, 0.39, E.inOutQuart(prog(t, 5.45, 6.3)));
    S = lerp(S, 0.4, E.outCubic(prog(t, 6.3, 6.6)));
    $("lockup").style.transform = `scale(${S})`;
    const rp1 = prog(t, 6.2, 7.0), rp2 = prog(t, 6.36, 7.0);
    $("rip1").setAttribute("r", 170 + 560 * E.outCubic(rp1)); $("rip1").setAttribute("opacity", rp1 > 0 ? 0.32 * (1 - rp1) : 0);
    $("rip2").setAttribute("r", 170 + 520 * E.outCubic(rp2)); $("rip2").setAttribute("opacity", rp2 > 0 ? 0.26 * (1 - rp2) : 0);
  }

  // ---- player ----
  const isRender = /render/.test(location.search + location.hash);
  const isSplash = document.body.classList.contains("splash");   // tela de abertura do programa (DESKTOP/splash.html)
  if (isRender) document.body.classList.add("render");
  const frame = $("frame"), stage = $("stage");
  const fit = () => {
    const fw = frame.clientWidth, fh = frame.clientHeight;
    const sc = isSplash ? Math.min(fw / 1920, fh / 1080) : fw / 1920;
    const ox = isSplash ? (fw - 1920 * sc) / 2 : 0, oy = isSplash ? (fh - 1080 * sc) / 2 : 0;
    stage.style.transform = `translate(${ox}px, ${oy}px) scale(${sc})`;
  };
  if (!isRender) { new ResizeObserver(fit).observe(frame); fit(); }

  let t0 = 0, paused = false, cur = 0, raf = 0;
  const fmt = (x) => x.toFixed(1).replace(".", ",");
  function show(t) { cur = t; render(t); $("bar").style.width = (t / DUR) * 100 + "%"; $("time").textContent = `${fmt(t)} s / 7,0 s`; }
  function loop(now) {
    const t = Math.min(DUR, (now - t0) / 1000);
    show(t);
    if (t < DUR && !paused) raf = requestAnimationFrame(loop);
    else if (t >= DUR) { paused = true; $("play").textContent = "Tocar"; if (isSplash) setTimeout(() => $("wait").classList.add("on"), 300); }
  }
  function play(from) { cancelAnimationFrame(raf); paused = false; $("play").textContent = "Pausar"; t0 = performance.now() - from * 1000; raf = requestAnimationFrame(loop); }
  function pause() { paused = true; cancelAnimationFrame(raf); $("play").textContent = "Tocar"; }
  $("play").addEventListener("click", () => { if (paused) play(cur >= DUR ? 0 : cur); else pause(); });
  $("replay").addEventListener("click", () => play(0));
  const seekFrom = (ev) => { const r = $("track").getBoundingClientRect(); const t = clamp((ev.clientX - r.left) / r.width) * DUR; pause(); show(t); };
  $("track").addEventListener("pointerdown", seekFrom);
  $("track").addEventListener("keydown", (ev) => { if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") { pause(); show(clamp(cur + (ev.key === "ArrowRight" ? 0.1 : -0.1), 0, DUR)); ev.preventDefault(); } });
  document.addEventListener("keydown", (ev) => { if (ev.code === "Space" && ev.target === document.body) { ev.preventDefault(); $("play").click(); } });

  window.__render = render;
  window.__ready = Promise.all([document.fonts.load('900 180px "CU Display"'), document.fonts.load('600 26px "CU Text"')]).then(() => {
    layout();
    if (isRender) { render(0); return; }
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (isSplash && reduce) { show(DUR); $("wait").classList.add("on"); }
    else if (reduce) { show(4.9); pause(); } else play(0);
  });
})();
</script>

</body>
</html>
