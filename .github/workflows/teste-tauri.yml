name: Instalador de teste (Tauri)

# Ramos teste/**: gera o instalador no Windows sem publicar release.
# O .exe fica em Actions > (execução) > Artifacts.
on:
  push:
    branches:
      - "teste/**"

jobs:
  instalador:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: https://dlbbmdtqewiggufnewif.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable__vfmtElQ1Hor13voGk1s8w_TQivq94_
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: DESKTOP/src-tauri
      - name: Compilar as telas
        working-directory: FRONTEND
        run: |
          npm ci --no-audit --no-fund
          npm run build:desktop
      - name: Gerar o instalador
        working-directory: DESKTOP
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles nsis --config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"
      - uses: actions/upload-artifact@v4
        with:
          name: CaixaUp-instalador-teste
          path: DESKTOP/src-tauri/target/release/bundle/nsis/*.exe
